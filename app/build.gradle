plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'mx.ssauroncorp.ecos'
    compileSdk 34

    defaultConfig {
        applicationId "mx.ssauroncorp.ecos"
        minSdk 28          // Android 9 (Pie) — requisito del usuario
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // AndroidX base
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Room (persistencia local, device-only)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // OSMDroid (mapa open-source, sin API key; coherente con Leaflet+OSM de la v1)
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // Play Services — Geofencing (despierta la app en background al cruzar el radio)
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // WorkManager (fallback de proximidad para dispositivos sin GMS)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Notificaciones (canales, Android 8+)
    implementation 'androidx.core:core:1.12.0'

    // Lifecycle / ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Android Auto — Car App Library
    implementation 'androidx.car.app:app:1.4.0'
    implementation 'androidx.car.app:app-projected:1.4.0'

    // SpeechRecognizer nativo de Android — reconocimiento de voz
    // API 31+: modo offline automático (createOnDeviceSpeechRecognizer)
    // API < 31: requiere internet (Google online)

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
